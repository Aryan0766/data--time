<script>

function onKawara () {
  document.body.style.background = '#1e3a5f'   
  // CHANGED: background color
  document.body.style.height = '100vh'
  document.body.style.display = 'grid'
  document.body.style.justifyContent = 'center'
  document.body.style.alignItems = 'center'

  const d = new Date()
  const day = d.getDate()
  const months = [
    'Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun',
    'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'
  ]
  const m = d.getMonth()
  const month = months[m]
  const year = d.getFullYear()
  const dateString = `${year}, ${day} ${month}.`   
  // CHANGED: order of the dateString

  const span = document.createElement('span')
  span.textContent = dateString
  span.style.color = '#ffd166'                      
  // CHANGED: font color 
  span.style.fontSize = '6vw'                       
    // CHANGED: font size 
  span.style.fontFamily = 'Georgia, "Times New Roman", Times, serif'  
  // CHANGED: font family
  document.body.appendChild(span)
}

window.addEventListener('load', onKawara)

</script>
