<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Date + Time</title>
</head>
<body>

<script>

function onKawara () {
  document.body.style.background = '#1b2a49'      // 1. background color
  document.body.style.margin = '0'
  document.body.style.minHeight = '100vh'
  document.body.style.display = 'grid'
  document.body.style.justifyContent = 'center'
  document.body.style.alignContent = 'center'     // keeps the stack centered

  const d = new Date()
  const day = d.getDate()
  const months = [
    'Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun',
    'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'
  ]
  const m = d.getMonth()
  const month = months[m]
  const year = d.getFullYear()
  const dateString = `${day} ${month} ${year}`    // 5. new order: day, month, year

  // 4. all five generic font families
  const families = ['serif', 'sans-serif', 'monospace', 'cursive', 'fantasy']

  families.forEach((family) => {
    const span = document.createElement('span')
    span.textContent = dateString
    span.style.color = '#fff105'                 
    span.style.fontSize = '26'                   
    span.style.fontFamily = family               
    span.style.textAlign = 'center'
    document.body.appendChild(span)
  })
}

window.addEventListener('load', onKawara)

</script>

</body>
</html>
